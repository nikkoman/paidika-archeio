name: Ενημέρωση αρχείου

on:
  repository_dispatch:
    types: [archive-update]
  push:
    branches: [main]
    paths: [data/archive.enc.json]
  workflow_dispatch:

concurrency:
  group: archive-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography

      - name: Εφαρμογή εντολής από το Discord
        if: github.event_name == 'repository_dispatch'
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          CMD: ${{ github.event.client_payload.cmd }}
          CH: ${{ github.event.client_payload.channel }}
          SID: ${{ github.event.client_payload.id }}
          RANGE: ${{ github.event.client_payload.range }}
          STATE: ${{ github.event.client_payload.state }}
          NOTE: ${{ github.event.client_payload.note }}
          OPS: ${{ github.event.client_payload.ops }}
        run: |
          case "$CMD" in
            mark)  python3 tools/archive.py mark "$CH" "$SID" "$RANGE" "$STATE" "$NOTE" ;;
            total) python3 tools/archive.py total "$CH" "$SID" "$RANGE" ;;
            batch) python3 tools/archive.py batch "$CH" "$SID" "$OPS" ;;
            *) echo "Άγνωστη εντολή: $CMD"; exit 1 ;;
          esac

      - name: Ευρετήριο για το bot
        env:
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          ARCHIVE_INDEX_KEY: ${{ secrets.ARCHIVE_INDEX_KEY }}
        run: python3 tools/archive.py index

      - name: Αποθήκευση
        env:
          BY: ${{ github.event.client_payload.by }}
          TITLE: ${{ github.event.client_payload.title }}
          RANGE: ${{ github.event.client_payload.range }}
          STATE: ${{ github.event.client_payload.state }}
        run: |
          git config user.name "Αρχείο bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "Καμία αλλαγή"; exit 0; fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            MSG="Discord: ${BY} — ${TITLE} ${RANGE} ${STATE}"
          else
            MSG="Ενημέρωση ευρετηρίου"
          fi
          git commit -m "$MSG"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 3; done
